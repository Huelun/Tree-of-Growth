rampage_event_Acheroth_1:
  event_type: "rampage"
  title: "A Growing Concern"
  description: >
    It is a beautiful suburban day. The sky is clear, the air is warm, and the only sound that pierces the peaceful
    suburbia is the chorus of birds singing to each other. That is, until you awaken. You yawn as you stumble out of
    your home, ready to dominate the neighborhood with your mighty body. With a menacing grin, you arch your back and
    bellow into the sky, your average voice causing a nearby squirrel to run and hide in a nearby tree.
    
    
    Breathing in heavy grunts, you begin your rampage down the sidewalk, each foot stomping down hard against the
    pavement. You let out a furious cry as you swipe out at trees and hedges as you pass them, their leaves sent
    helplessly flying the ground. You kick a neighbors garbage bin, and though you don’t have the strength to topple it
    over, you do knock an empty soda can lose. With a wicked grin you stomp on top of it, relishing in the metallic
    crunching as it is crushes under foot.
    
    
    You approach a nearby bus stop, and with a bloodthirsty roar, pound both
    fists against the clear Plexiglas. The furries waiting beyond the clear barrier jolt in shock as they behold you.
    “Are you alright? Do you need any help?” a concerned rabbit cries out to you. Yes, concern. You have wrought such
    terrible concern to the neighborhood! You continue stomping down the street, cackling evilly to yourself.
    
    
    Your stroll got your blood flowing, and gave you quite a workout!
  requirements:
    min_size: 40
    max_size: 80
  reward:
    type: "body"
  author:
    name: "Acheroth"

rampage_event_Acheroth_2:
  event_type: "rampage"
  title: "At the Mall"
  description: >
    It is a busy day at the mall; the shops and promenades were packed as the weekend crowd shopped, socialized, and ran
    their errands. But their day was about to sour.
    
    
    You stomp angrily up the escalator, your face contorted into a sneer. You grunt loudly as you roughly push past
    others, ignoring their disgusted expressions and insults. Once at the top, you bellow out an enraged roar, and with
    the confused stares of nearby shoppers, charge into a recycling bin. The bin full and heavy, and your body is
    relatively average, so there is no clear winner. You both bounce off each other, sending you sliding across the
    smooth polished floor. But while you are in one piece, the bin is not. It’s lid clanks loudly as it's flung across
    the promenade, and lose garbage is strewn all over the nearby floor.
    
    
    A confused murmur rises from the crowd as you laugh in delight at the mess. You waste no time in grabbing a small
    potted plant and rip it from it’s soil, throwing it down onto the floor below. You grab a smoothie from an onlooking
    lioness, and with a manic cry you pour it down your throat as quickly as possible. Her protests fall on your cold,
    deaf ears as the sweet sugary slush drips down your maw and neck. Once sated, you throw the sticky wet cup at a
    nearby shop front window, laughing maniacally as you watch it slowly slide down, leaving a streak of mess. You roar
    triumphantly at your path of destruction, your average voice drowning in the steady drone of the mall’s ambiance.
    
    
    A big hulking horse in a security uniform comes up and grabs you by your collar, leading you forcefully towards the
    exit. You go with him, but not because you are following him. You were simply going to go that way anyway. Oh, if
    only the guard knew how lucky he was. You chose to let him live, but only so that he can tell his story.
    
    
    The smoothie was delicious and a meal in itself! You have consumed {dinner} and grown {d_weight} heavier
    and {size} taller.
  requirements:
    min_size: 40
    max_size: 80
  reward:
    type: "instant_food"
    name: "smoothie"
    size: 0.9936696
  author:
    name: "Acheroth"

rampage_event_Acheroth_3:
  event_type: "rampage"
  title: "Terrifying Presence"
  description: >
    You breathe in deeply, taking in the fresh morning air as you walk your larger than normal body through the quiet
    suburban sidewalks. Furries of all kind walk past you, hurrying on their way to work or errands. And they all step
    aside, their eyes unable to hide their surprise at your scale. Your smug grin slowly turns more wicked as you
    steadily feel a primal urge rising above you. Big. You are Big. And it was time to show it.
    
    
    With a deep growl, you lash out and hit someone’s mailbox. Your claws scrape against the thin steel as it snaps off
    it’s post, sending unopened bills flying across the lawn. With a guttural snarl, you charge into a full garbage bin,
    sending it flying several meters down the street, flinging lose refuse over lawns, footpaths, streets and parked
    cars alike. You hear gasps from nearby furries who quickly cross the street to avoid you. Without missing a beat,
    you pick the garbage bin up and start beating it over a parked car, causing shallow dents in its metallic panels.
    The alarm quickly sounds, but its piercing shriek is forced to compete with your own deep, furious shouts “Hey!” you
    hear a voice shout out from behind you. Reflexively, you turn to see a slender but angry fox comes barging out of a
    near by house “What the fuck are you doing to my car?” He yells. In response, you growl at him menacingly, your
    large teeth barred and unnaturally large frame deathly still. The fox’s expression changes instantly into fear,
    before he quickly runs back into his house, the click of his lock carrying all the way back to your ears. Your snarl
    rises into a victorious roar. Your deeper than normal voice carries louder and further than even you expected,
    riling up a number of dogs around the neighborhood who bark furiously in response.
  requirements:
    min_size: 80
    max_size: 160
  reward:
    type: "body"
  author:
    name: "Acheroth"

rampage_event_Acheroth_4:
  event_type: "rampage"
  title: "Force of Nature"
  description: >
    It is a beautiful day at the beach. Hundreds of sunbathers, swimmers and surfers have come out to enjoy the warm sun
    and crashing waves. But little did they know their perfect day in paradise was about to take a dreadful turn.
    
    
    Grunting and snorting, you stomp down the beach, feet sinking into the helpless sand with each footfall. You roar at
    some nearby children who are returning from their swimming trip. Startled, they begin to cry and run to their
    parents, a futile reaction as they would be able to protect them from you! But still, you think, there a lot more
    rampaging to do so you'd better move along quickly.
    
    
    Snarling, you find an abandoned sandcastle. It is actually quite impressive; its many keeps and walls have fine
    details. But none of them can withstand your mighty feet! With cries of fury, you stomp and kick that castle into
    the ground. Nearby onlookers shake their heads at your wonton destruction. You smirk at them and stomp on.
    
    
    Your terrifyingly average frame approaches the local boardwalk, a popular landmark full of buskers and carnival
    rides. They all turn to watch you loudly stomp and grunt your way across the wooden planks. Some foreign tourists,
    apparently not accustomed to how unusually frightening you are, laugh and clap in delight as they film you stomping
    past them. They throw you some troves, apparently mistaking you for a performer. Fools! You are a force of nature,
    completely above the want or need for earthly possessions! You pick them up regardless; they could be useful for
    stomping on later.
    
    
    You have collected **{troves} of troves** from your day out at the beach!
  requirements:
    min_size: 40
    max_size: 80
  reward:
    type: "troves"
  author:
    name: "Acheroth"

rampage_event_Acheroth_5:
  event_type: "rampage"
  title: "At the Mall 2"
  description: >
    It was a quiet day at the mall, the lazy Wednesday afternoon crowd sparse and relaxed as they wandered almost
    aimlessly through the open concourses. That is, until they hear a terrible roar echoing from around the corner.
    
    
    Your larger than natural frame appears, throwing a garbage bin over a nearby guardrail onto the floor below you. It
    explodes on impact, covering everything nearby in bin juice. With another roar, you turn around and charge towards
    the food court. Any shopper anywhere near you quickly flees into nearby stores to escape your frighteningly large
    and fast form.
    
    
    You crash into the dining area, tables and chairs splintering and bending as they are thrown haphazardly into the
    air. Still you run, carving a path through the seating arrangements as you approach a delicious store selling what
    looks to be Chinese food. The two workers see you coming and flee out the back, before your form slams into the fake
    marble counter, causing it to crack loudly and fracture. Snarling and roaring angrily, you reach behind the glass
    counter top, and tear it off towards you instead. You slam it down behind you before gorging on what is on offer;
    beef with black bean, sweet and sour chicken, pork lo mien… each mouthful is even more delicious than the last.
    
    
    Suddenly you feel something sharp strike your flank, before your whole body seizes up in explosive pain. Suddenly
    you are on the floor, and you groggily see that you have been hit by a taser, held by a fearful burly horse in a
    security uniform. You snarl and start to pick yourself up, but you quickly double back in pain on the floor at the
    squeeze of the horse’s finger.
    
    
    Soon, you are surrounded by guards, who each take control of one of your limbs, and start lifting you towards the
    exit. You struggle wildly, your strength easily outmatching any of your carriers; but not all four. It seems your
    rampage is over a little early today.
    
    
    Your Chinese dinner was very filling! You have eaten {dinner} and grown {d_weight} in weight and {size} in height!
  requirements:
    min_size: 80
    max_size: 160
  reward:
    type: "instant_food"
    name: "Chinese food"
    fill_stomach: True
  author:
    name: "Acheroth"

rampage_event_Acheroth_6:
  event_type: "rampage"
  description: >
    Your footsteps pound heavily on a sidewalk that is barely wide enough to contain you. You growl softly with each
    deep breath, your deep and rumbling voice piercing the quiet piece of the neighborhood. Oncoming furries are
    startled and either cross the street or walk back the way they came, their disbelieving eyes never leaving your
    immense frame. Big. You are just so very, unnaturally big.
    
    
    You don’t even bother to look before crossing the street. Sure enough, an oncoming car comes to a screeching halt as
    it approaches your hulking form. It was not traveling fast, but your strides are long and it did not see you until
    it was right there in front of you. It hits your leg, forcing you to step backwards. It was not a big hit; more of a
    forceful nudge. But the audacity of something pushing you around makes you flash with incredible rage!
    
    
    With a deafening sonorous roar that echoes through the street, you lunge forwards and strike the car’s hood with
    both fists. The metal folds under your fists, and the engine sputters to a halt. You are not done, however. You rain
    blow after blow down on the increasingly mangled hood, your strikes causing the car to bounce on its own suspension.
    The driver quickly opens his door and flees; but you are busy trying to lift the car up.
    
    
    With a lot of effort and barred teeth, you manage to lift its front wheels off the ground. But it is just too heavy
    to disrupt it’s center of mass. With a frustrated grunt, you settle for ripping what is left of the hood from its
    street.
    
    
    You’ve successfully combined rampaging with looting! You collect {troves} of troves from your endeavors.
  requirements:
    min_size: 160
    max_size: 320
  reward:
    type: "troves"
  author:
    name: "Acheroth"

rampage_event_Acheroth_7:
  event_type: "rampage"
  description: >
    Downtown. The overpopulated, expensive heart of your city. There is no better location for you to wreck maximum
    havoc. You sneer wickedly as you stomp down the broad sidewalk in a wide, hunched gait. The populace pay you
    no heed; they have been desensitized to aberrant behavior from strangers; your malevolence was completely invisible
    to them!


    You push the pedestrian button at every street, even though you have no intention to cross! You tuck loose
    bits of rubbish under the windshield wipers of parked cars! You inform a ticketing officer that someone is
    parked illegally in front of a fire hydrant down the street! There is seemingly no end to the chaos you are
    causing, and onlookers are powerless to stop you!


    Seizing the momentum, you charge into a highrise and make your way to the elevator bank. It’s populated by
    a small crowd of professionally dressed furries that turn to face you as you come grunting and sprinting towards
    them. You knock over a potted plant standing between the elevator doors, causing moist soil and mulch to spill
    across the shiny floor. Now, if anyone were to get on or off one of the cars, they would get their shoes dirty!
    You relish in the onlookers startled confusion for a moment, before laughing maniacally and running back out
    of the building.


    Your wave of destruction would soon be brought to a heel however, as a passing delivery van drives through
    a putrid puddle that lay on the street next to you. A torrent of filth sprays over your average body, drenching
    you from head to toe. It felt warm as it began to be absorbed by your hide, a pleasant and tingly sensation.
    You begin to laugh maniacally as the feeling spreads deep within you; the mysterious chemicals that lay in
    that toxic swill gave you extra powers!
  requirements:
    min_size: 40
    max_size: 80.0
  reward:
    type: "buff"
  author:
    name: "Acheroth"
rampage_event_Devon_1:
  event_type: "rampage"
  description: >
    It was a relatively normal day in the city, you were much larger than the normal folks who all gawked at you,
    and their attention filled you with pride. You felt as if you were bigger than the rules, you felt as if you
    could do anything. In your prideful daze, you cross a road without looking both ways. A red sedan comes screeching
    towards you, the horn blaring, and the sheepish driver flashing you a panicked look from behind the wheel.
    It slows down enough not to wipe you out, but it still hits you and bumps you back a little.


    You feel your anger welling up inside you, your eyes burn red with fury as you bend over to grip the bumper
    of the car that had assaulted you, your hands crushing through it as if it was a soda can, releasing a satisfying
    crunch. The driver rushes out pleading for you to stop, but in your rage you cannot hear them. Flexing your
    muscles you begin to hoist the car up from the ground, the metal vehicle groaning as if it was begging you
    to spare it, but you won’t. Continuing to lift, you get it to a point where you know you could just flip it
    over and just that, you will. With a final heave you swing your arms upward, tossing the car as if it was merely
    a toy to you, it flies back and lands on its top smashing the roof and windows. You approach the little driver,
    your frame dwarfing theirs, anger still boiling in your blood. The driver trembles as they stare up at you,
    they fumble through their pockets before they pull out a bag of Troves.


    “Please take this and don’t hurt me!" they whimper.


    You snatch the bag from their little hands, and they scurry off with their tail between their legs.


    You gain {troves} of Troves from the little person, just enough to quell your anger.
  requirements:
    min_size: 80
    max_size: 160.0
  reward:
    type: "troves"
  author: "Devon"
rampage_event_Devon_2:
  event_type: "rampage"
  description: >
    It was a beautiful day to go to the beach, so you thought, but it seems like you weren’t the only one. The
    beach was busy as ever, people were camped out in such a way you could barely see the sand… It would be impossible
    for you to find a spot to lay down comfortably at your current size.


    You simply just wanted a day to relax in the sun, but these people were in your way. You charge into the crowds
    frustrated, kicking up bucketloads of sand at people as you move, knocking down sturdy umbrellas with your
    mighty limbs, and trampling beach chairs under your wake. You felt like a giant rampaging through a city albeit
    you were only destroying umbrellas, chairs, and other beach paraphernalia. People gave you estranged looks
    as they began to relocate further away from your tantrum.


    Letting out a triumphant roar to announce to the world who you were and what you have done, your rampage is
    finally complete. You’ve claimed a comfortable spot on the beach, and using the broken debris from your rampage
    as a beach towel, you lay down and enjoy the sun.


    Feeling yourself wind down as you watch the sunset, you think about what you have done, the things you have
    broken, you don’t feel bad about it, in fact you feel inspired by your rampage, perhaps you’ll break something
    bigger next time.
  requirements:
    min_size: 80
    max_size: 160.0
  reward:
    type: "buff"
  author: "Devon"
rampage_event_Alsend_1:
  event_type: "rampage"
  description: >
    You stride along downtown, smirking at the stares. You draw quite a lot of attention due to your size that
    is by now clearly unnatural. You observe your surroundings, enjoying how the crowd parts, clearly able to pick
    up on your destructive intentions, or just intimidated by your superior size. You go to cross the street when
    you run into something, much to your annoyance feeling like bruised yourself. What dares inconvenience YOU?


    You look down and spot a car... Who would leave a car HERE, on the side of the road by a parking meter?! How
    DARE they! And you were just minding your own business, looking for... something... to... destroy.


    You grin a toothy grin, rear back and strike at the car... And while it dents, a jolt of pain is felt from
    the impact. After recovering you seethe and let the hate flow through you. Going high this time, you bring
    your weight down on the car from the top, a satisfying crunch, and no pain. Success! You proceed and start
    to flatten the car, when at the trunk something breaks and something neon green is on your body. Investigating
    you decide its either some mad scientist formula... Or Mountain Dew. A taste test confirms it isn't Mountain
    Dew, but before you can sputter long someone yells at you. Hey! What did you do... To... My... C-car?" The
    below average mouse's tail goes limp as they see you stand to your full height. Their glasses and lab coat
    make them look like a stereotypical scientist. You simply growl at them, making them flinch back before you
    run off down the street to cause more chaos!


    However, as you do, you feel strange... Lighter... More energized! Maybe that formula did more than just taste
    nasty?
  requirements:
    min_size: 160
    max_size: 320.0
  reward:
    type: "buff"
  author: "Alsend"
rampage_event_Alsend_2:
  event_type: "rampage"
  description: >
    You prowl along the streets of the suburbs, grinning widely. You can see the people can tell you're up to no
    good, and they rush into and cower in their homes from your unnaturally immense size. Good. You’re terrifying
    and here to cause havoc. And maybe find a snack as your stomach growls. Big rampaging monsters need their food,
    after all.


    You come across a park and find a bunch of food all set up for you! How gracious of the residents to leave
    you an offering! You rush over, the concrete just resisting your impact as you strike the ground hopping off
    a step. If you get much bigger, it'll likely start cracking under you.


    As you start to devour the offering, making sure to toss whatever dishes you finish around to make a mess (you’re
    not some goody two shoes after all) you see some people approaching, then some kids start crying. Oh, this
    was a child's birthday party, not an offering to you. A bit disappointing on one hand... But on the other how
    wicked of you! You decide to take it as a win and hurry off to cause more destruction and ruined days after
    that hearty meal!
  requirements:
    min_size: 160
    max_size: 320.0
  reward:
    type: "dinner"
  author: "Alsend"
rampage_event_Alsend_3:
  event_type: "rampage"
  description: >
    You smirk, as you leave the city behind, it’s about time to leave your metaphorical (and getting more literal
    by the day) stomping grounds to spread your legs and ensure everyone knows to fear you! And the people will
    learn to fear you as you start to rush off, feeling the heft of your weight as you rush out into the countryside.


    After a few minutes you come across a house, flinging yourself into the air and flattening their entire flowerbed
    in one leap before punting a wheelbarrow. Take that, nature! You hurry along to the next place to continue
    your destructive spree.


    After the next house, you spot some grazing cattle. Usually these would be large, heavy, and out of the scope
    of an individual... But you are more. You are BIG, and you divert, barging through the fence like it wasn’t
    there and slamming into a cow... It budges but you bounce back. Ok, too heavy to check yet... But... You plant
    your center of gravity and push, feeling the cow, frozen in fear you’re certain, tip over onto its side! You
    laugh as you perform a task science says would take multiple people alone! You hurry on towards the next house,
    breaking another hole in the fence as the cow stands back up and returns to grazing.


    Unfortunately, you weren’t quite expecting these rural farmers to be so... Far apart, and after only a few
    more houses you’re starting to feel the burn of your destructive rush from house to house. As such, you decide
    to head back into the city, at a slower pace, and remember to take it a bit slower next time to go longer.
    Though you do consider on the other hand it WAS a good workout, and got your blood pumping, so maybe you WILL
    do this again. Though for now you just want to rest.
  requirements:
    min_size: 160
    max_size: 320.0
  reward:
    type: "body"
  author: "Alsend"
rampage_event_Alsend_4:
  event_type: "rampage"
  description: >
    You stomp along the sidewalk, smirking as you glance back and see your storming us causing slight damage to
    the sidewalk, seeing you’re starting to get too big for even the ground to resist is a very good thing... But
    big people need big cash, and for that, you've decided to participate in some grand theft auto. And not the
    video game.


    As you hunt for a mark, you look at those looking at your massive form nervously, making most flinch away.
    The bolder ones are cowed by a snarl towards them, nobody wanting to draw the ire of someone so large.


    Then, you find it. It’s a very nice car, and a model you recognize as tough and easy to repair. Just in case.
    It's heist time! Time to be as sneaky as someone like you can be...


    You rush over as the owner in a nice suit is getting out. You toss them to the sidewalk and disengage the parking
    brake before closing the door ever so gently- oops, you broke the windows.


    You climb on top of the car, trying to minimize damage, and proceed to use your long limbs to reach the ground
    and push off, using the car like an oversized skateboard as you make off with your ill-gotten goods! You even
    manage to cause mass havoc along the way, tearing up street signs, causing crashes, and violating SO many traffic
    laws!


    You pawn the car off for {troves} of troves to a fence who seemed very eager to pay you and get you out. Who
    ever said that crime didn't pay?
  requirements:
    min_size: 320
    max_size: 640.0
  reward:
    type: "troves"
  author: "Alsend"
rampage_event_Alsend_5:
  event_type: "rampage"
  description: >
    You stride through the suburbs. The people on the sidewalk must watch your step as they're too small to be
    able to rely on you noticing before you move over them and smush them. You hardly even noticed the car you
    crumpled under your mass a few blocks back.


    You see a flash of light and move to a house, knocking over its fence, and look into the second story window.
    You watch the person playing a game until they notice you and scream, tumbling over and yanking cords around
    them. You just laugh! You didn’t even need to DO anything but watch!


    When you turn around you see a crowd. What, were they stupid enough to try and chase you out? But no, one steps
    forward and makes an offer. You leave their neighborhood alone for payment. Looking at their offering, it’s
    a nice haul, so you agree. Sure, you’d take the {troves} of troves and leave them be... For now. After all,
    when you were even bigger, they wouldn’t be able to argue with you!
  requirements:
    min_size: 640
    max_size: 2560.0
  reward:
    type: "troves"
  author: "Alsend"
rampage_event_Alsend_6:
  event_type: "rampage"
  description: >
    Sometimes it was annoying walking among the smaller folk. Being so large they'd annoy you with blabber about
    'watch your step!' and 'I cant see' then act all surprised when they ended up under you somehow. Seriously,
    be it a stomp or tail flatten, they never learn!


    That's why you came out to the pond. You suppose some called it a lake, but you were big, so it was a pond,
    to soak in the water as it was said to be strangely warm, and they're right. Not long after you do, however,
    you bump into something. Fishing it out, you find yourself holding a nuclear waste barrel. Flinching, you hurl
    it, coincidentally towards the nearest facility, before scrambling out of the water.


    Once outside you use a nearby tree to scratch against in the vain attempts to scratch any radiation off, accidentally
    toppling it and you fall over, flailing as your body knocks more trees over. However, when you recover you
    feel... Good. Really good! Maybe the waste somehow... Powered you up? You stand and grin before stomping towards
    the city. If so, then you could officially call yourself a Kaiju, even if a small one... And Kaiju rampage
    in cities!
  requirements:
    min_size: 640
    max_size: 2560.0
  reward:
    type: "buff"
  author: "Alsend"
rampage_event_Alsend_7:
  event_type: "rampage"
  description: >
    You realize you've been tormenting the city enough with your destructive rampages. But you know what HASN'T
    received your destructive bouts enough? NATURE! You head into the forest, ready to introduce Mother Nature
    to... Well, you don’t have a funny saying to finish that, but you're so big, who cares?  As you push over trees,
    ruin trails, and generally be a destructive menace, you hear growls. It seems you wandered on a Wolf hunting
    party, and they weren't happy about it!  Too bad for them you're as strong as you're tall! You manage to take
    them down quite easily, even if some end up not making it. You look at the wolf and wonder how Wolf Steak tastes.
    You gain an opportunistic meal from the slain wolves.
  requirements:
    min_size: 640
    max_size: 2560.0
  reward:
    type: "custom_food"
    name: "Wolf Steak"
  author: "Alsend"
rampage_event_Alsend_8:
  event_type: "rampage"
  description: >
    Annoyed with the crowded sidewalk, you decide to walk on your personal one, even if the annoying littles call
    them 'roads' and insist on using their cars on it. No matter, you're large enough that you can go over any
    that come your way, and if a few ended up crumpled... Oh well. They should just be glad the pedestrians are
    quick enough to watch your step  Sadly, the littles don't agree and soon the police are on the way. You're
    not scared of them, but you’d rather not deal with them, so you start to run, leaving damaged road behind you
    as you add small bounds to move over large traffic jams faster. You go over a police barricade, not sure why
    they thought that would work.  It’s not all that hard to escape in all honesty, as the police were restricted
    to cars and horizontal maneuvering... And you weren’t. Using buildings to do fast turns that leave you wanting
    to yell 'PARKOUR!' and the rubble left behind from things you throw behind you make keeping up with you a lost
    cause.  Once out of the city, you laugh in triumph. They already couldn’t catch you, and you kept getting bigger!
    Soon they wouldn't be able to STOP you either!  That chase was quite a workout!
  requirements:
    min_size: 640
    max_size: 2560.0
  reward:
    type: "body"
  author: "Alsend"
rampage_event_Alsend_9:
  event_type: "rampage"
  description: >
    You heard about an area of town that was being struck by a rash of big people causing mayhem, so you came yourself...
    But not to help. They're rampaging and causing destruction...


    Thats YOUR job!


    You spot one exiting with some cash registers from a store and stop them, smirking down at them. They look
    up in awe and a bit of fear as you take their ill gotten gains for yourself before pushing them over. "Get
    lost, shrimp!" You taunt before moving on. Any bigger person rampaging you come across, you effortlessly outsize
    and outdo. They beating at a car? You flatten it. They stealing? You take what they took... And maybe more.


    Soon you leave to ther other's relief, making out with {troves} of stolen goods taken from smaller bigs. Today
    was a good day.
  requirements:
    min_size: 2560
    max_size: 10240.0
  reward:
    type: "troves"
  author: "Alsend"
rampage_event_Alsend_10:
  event_type: "rampage"
  description: >
    You feel the concrete shake and give under your mass, as you stride down a little suburb. You'd heard your
    friends who had paid you to leave them alone before (they say bribe, but you disagree) were holding a massive
    party, and didn't invite you! How rude!


    You sweep cars off the road with the most casual of ease, as you approach the little community. Seems they
    made it a gated community since you were last here. No matter, you simply step over the gate and keep on in.


    As you approach, you hear a ruckus, obviously the party, but it gets quiet as you come into view as everyone
    seems tense. You scold them about not inviting their dearest friend too, plopping down in the back, smirking
    down at them and after a few moments they start to get back to what they were doing.


    It seemed they were holding some kind of music festival with catering. The music was actually pretty good,
    and so was the catering. Of course you had to tell them that as you ate the whole thing by yourself before
    it was technically out. Oops. Oh well. Nobody had the heart to mention how the {dinner} of catering seemed
    to have made you {d_weight} or {size} bigger either. Or how in getting the food you toppled 3 trees, destroyed
    all the tents, then sat on a car as you ate.
  requirements:
    min_size: 2560
    max_size: 10240.0
  reward:
    type: "instant_food"
    name: "Catering"
  author: "Alsend"
rampage_event_Alsend_11_1:
  event_type: "rampage"
  description: >
    You're getting very big, that is true, but you always wanted to stomp houses. Unfortunately, you're not quite
    large enough for the ones you think of. Yet. But practice makes perfect, and you need to practice after all!


    That's what brings you to trailer park as you grin as you look at all the tin cans you're about to crumple.
    You go for a classic Kaiju crush on the first, stomping it under your sole, the trailer gives in under your
    weight, going into a V shape as you move for your next toy.


    The next trailer is taller, but not as wide, as you can reach around it. You decide to hug it into a flat sheet
    of metal. They could call you the trailer compactor! You then spot it.


    A large, fancy (relatively) trailer. You approach and decide to have fun with it. You grip it and lift, tearing
    the connections from the ground as you carry it. This one is occupied as the residents beg for you to let them
    go, but you just laugh and let them squirm as you stomp off, but eventually get tired and ditch the trailer.
    Maybe next time you'll be able to steal it entirely. Regardless, it burned some energy and carrying the trailer
    left a light pleasant burn.
  requirements:
    min_size: 2560
    max_size: 10240.0
  reward:
    type: "body"
  body_blacklist:
    - "Snake male"
    - "Snake female"
    - "Kentaur male"
    - "Kentaur female"
  author: "Alsend"
rampage_event_Alsend_11_2:
  event_type: "rampage"
  description: >
    You're getting very big, that is true, but you always wanted to stomp houses. Unfortunately, you're not quite
    large enough for the ones you think of. Yet. But practice makes perfect, and you need to practice after all!


    That's what brings you to trailer park as you grin as you look at all the tin cans you're about to crumple.
    You go for a classic Kaiju crush on the first, lifting your tail high enough and bringing it down, the trailer
    gives in under your weight, going into a V shape as you move for your next toy.


    The next trailer is taller, but not as wide, as you can reach around it. You decide to constrict it into a
    flat sheet of metal. They could call you the trailer compactor! You then spot it.


    A large, fancy (relatively) trailer. You approach and decide to have fun with it. You wrap your body around
    it and lift, tearing the connections from the ground as you carry it. This one is occupied as the residents
    beg for you to let them go, but you just laugh and let them squirm as you stomp off, but eventually get tired
    and ditch the trailer. Maybe next time you'll be able to steal it entirely. Regardless, it burned some energy
    and carrying the trailer left a light pleasant burn.
  requirements:
